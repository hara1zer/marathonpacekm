<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 393" role="img" aria-labelledby="title desc"><title id="title">32 km rehearsal: early lap range and final two full laps</title><desc id="desc">First ten kilometres had recorded two-kilometre laps at 5:16–5:31 per km. The final two full laps averaged 6:28 and 6:47 per km. The missing intervening laps are not reconstructed.</desc><rect x="0" y="0" width="640" height="393" rx="12" fill="#f6f8f3"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="38" font-size="23" fill="#152d27" text-anchor="start" font-weight="bold">The finish of my 32 km rehearsal</text><text x="28" y="64" font-size="14" fill="#496258" text-anchor="start" font-weight="normal">9 August 2026 · average pace within recorded 2 km laps</text><line x1="230.0" y1="100" x2="230.0" y2="270" stroke="#d5e1d9" stroke-width="1"/><text x="230.0" y="297" font-size="14" fill="#496258" text-anchor="middle" font-weight="normal">5:00</text><line x1="317.0" y1="100" x2="317.0" y2="270" stroke="#d5e1d9" stroke-width="1"/><text x="317.0" y="297" font-size="14" fill="#496258" text-anchor="middle" font-weight="normal">5:30</text><line x1="404.0" y1="100" x2="404.0" y2="270" stroke="#d5e1d9" stroke-width="1"/><text x="404.0" y="297" font-size="14" fill="#496258" text-anchor="middle" font-weight="normal">6:00</text><line x1="491.0" y1="100" x2="491.0" y2="270" stroke="#d5e1d9" stroke-width="1"/><text x="491.0" y="297" font-size="14" fill="#496258" text-anchor="middle" font-weight="normal">6:30</text><line x1="578.0" y1="100" x2="578.0" y2="270" stroke="#d5e1d9" stroke-width="1"/><text x="578.0" y="297" font-size="14" fill="#496258" text-anchor="middle" font-weight="normal">7:00</text><text x="215" y="133" font-size="14" fill="#152d27" text-anchor="end" font-weight="normal">First 10 km: lap range</text><text x="215" y="197" font-size="14" fill="#152d27" text-anchor="end" font-weight="normal">Penultimate full lap</text><text x="215" y="255" font-size="14" fill="#152d27" text-anchor="end" font-weight="normal">Final full lap</text><line x1="276.4" y1="128" x2="319.9" y2="128" stroke="#174f40" stroke-width="12"/><text x="298.15" y="108" font-size="14" fill="#152d27" text-anchor="middle" font-weight="bold">5:16–5:31/km</text><circle cx="485.2" cy="192" r="6" fill="#174f40"/><text x="485.2" y="177" font-size="14" fill="#152d27" text-anchor="middle" font-weight="bold">6:28/km</text><circle cx="540.3" cy="250" r="6" fill="#174f40"/><text x="540.3" y="235" font-size="14" fill="#152d27" text-anchor="middle" font-weight="bold">6:47/km</text><text x="28" y="340" font-size="13" fill="#496258" text-anchor="start" font-weight="normal">Early range and final two full laps only; not the complete lap trace.</text><text x="28" y="366" font-size="14" fill="#152d27" text-anchor="start" font-weight="bold">Completing the distance and finishing in control are different checks.</text></g></svg>
