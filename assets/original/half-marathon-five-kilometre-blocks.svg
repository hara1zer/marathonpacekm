<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 632" role="img" aria-labelledby="title desc"><title id="title">Five-kilometre pace averages for the 2025 and 2026 half-marathon records</title><desc id="desc">2025 averages in seconds per kilometre: 333.4, 353.0, 375.8, 384.2. 2026: 315.4, 316.2, 316.6, 308.6. Each is an arithmetic mean of five displayed full-kilometre paces. GPS distance loss limits exact between-year alignment.</desc><rect width="720" height="632" rx="12" fill="#f6f8f3"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="38" font-size="23" fill="#152d27" text-anchor="start" font-weight="bold">How the first 20 recorded kilometres changed</text><text x="28" y="66" font-size="14" fill="#496258" text-anchor="start">Five-kilometre averages from the displayed full-kilometre splits</text><text x="28" y="95" font-size="16" fill="#965000" text-anchor="start" font-weight="bold">2025</text><text x="140" y="95" font-size="16" fill="#174f40" text-anchor="start" font-weight="bold">2026</text><text x="28" y="160" font-size="16" fill="#152d27" text-anchor="start" font-weight="bold">km 1–5</text><line x1="210" y1="142" x2="636" y2="142" stroke="#d5e1d9" stroke-width="1"/><circle cx="350.2199999999999" cy="142" r="4.5" fill="#965000"/><text x="655" y="147" font-size="16" fill="#965000" text-anchor="end" font-weight="bold">5:33.4</text><line x1="210" y1="175" x2="636" y2="175" stroke="#d5e1d9" stroke-width="1"/><circle cx="290.81999999999994" cy="175" r="4.5" fill="#174f40"/><text x="655" y="180" font-size="16" fill="#174f40" text-anchor="end" font-weight="bold">5:15.4</text><text x="28" y="251" font-size="16" fill="#152d27" text-anchor="start" font-weight="bold">km 6–10</text><line x1="210" y1="233" x2="636" y2="233" stroke="#d5e1d9" stroke-width="1"/><circle cx="414.9" cy="233" r="4.5" fill="#965000"/><text x="655" y="238" font-size="16" fill="#965000" text-anchor="end" font-weight="bold">5:53.0</text><line x1="210" y1="266" x2="636" y2="266" stroke="#d5e1d9" stroke-width="1"/><circle cx="293.46" cy="266" r="4.5" fill="#174f40"/><text x="655" y="271" font-size="16" fill="#174f40" text-anchor="end" font-weight="bold">5:16.2</text><text x="28" y="342" font-size="16" fill="#152d27" text-anchor="start" font-weight="bold">km 11–15</text><line x1="210" y1="324" x2="636" y2="324" stroke="#d5e1d9" stroke-width="1"/><circle cx="490.14" cy="324" r="4.5" fill="#965000"/><text x="655" y="329" font-size="16" fill="#965000" text-anchor="end" font-weight="bold">6:15.8</text><line x1="210" y1="357" x2="636" y2="357" stroke="#d5e1d9" stroke-width="1"/><circle cx="294.7800000000001" cy="357" r="4.5" fill="#174f40"/><text x="655" y="362" font-size="16" fill="#174f40" text-anchor="end" font-weight="bold">5:16.6</text><text x="28" y="433" font-size="16" fill="#152d27" text-anchor="start" font-weight="bold">km 16–20</text><line x1="210" y1="415" x2="636" y2="415" stroke="#d5e1d9" stroke-width="1"/><circle cx="517.8599999999999" cy="415" r="4.5" fill="#965000"/><text x="655" y="420" font-size="16" fill="#965000" text-anchor="end" font-weight="bold">6:24.2</text><line x1="210" y1="448" x2="636" y2="448" stroke="#d5e1d9" stroke-width="1"/><circle cx="268.38000000000005" cy="448" r="4.5" fill="#174f40"/><text x="655" y="453" font-size="16" fill="#174f40" text-anchor="end" font-weight="bold">5:08.6</text><line x1="240.0" y1="476" x2="240.0" y2="482" stroke="#d5e1d9" stroke-width="1"/><text x="240.0" y="502" font-size="14" fill="#496258" text-anchor="middle">5:00</text><line x1="339.0" y1="476" x2="339.0" y2="482" stroke="#d5e1d9" stroke-width="1"/><text x="339.0" y="502" font-size="14" fill="#496258" text-anchor="middle">5:30</text><line x1="438.0" y1="476" x2="438.0" y2="482" stroke="#d5e1d9" stroke-width="1"/><text x="438.0" y="502" font-size="14" fill="#496258" text-anchor="middle">6:00</text><line x1="537.0" y1="476" x2="537.0" y2="482" stroke="#d5e1d9" stroke-width="1"/><text x="537.0" y="502" font-size="14" fill="#496258" text-anchor="middle">6:30</text><text x="655" y="502" font-size="14" fill="#496258" text-anchor="end">min/km</text><text x="28" y="540" font-size="16" fill="#965000" text-anchor="start" font-weight="bold">2025: +50.8 sec/km from the first block to the fourth</text><text x="28" y="568" font-size="16" fill="#174f40" text-anchor="start" font-weight="bold">2026: −6.8 sec/km from the first block to the fourth</text><text x="28" y="604" font-size="14" fill="#496258" text-anchor="start">These are recorded-lap comparisons, not exact race-half splits.</text></g></svg>
