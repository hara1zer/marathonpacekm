width="440" height="44" rx="6" fill="#edf3e7"/><text x="34" y="397" font-size="20" fill="#152d27" text-anchor="start" font-weight="normal">40 km</text><text x="443" y="397" font-size="23" fill="#152d27" text-anchor="end" font-weight="bold">3:04:51</text><rect x="20" y="426" width="440" height="44" rx="6" fill="#f6f8f3"/><text x="34" y="455" font-size="20" fill="#152d27" text-anchor="start" font-weight="normal">Finish</text><text x="443" y="455" font-size="23" fill="#152d27" text-anchor="end" font-weight="bold">3:15:00</text><text x="26" y="525" font-size="13" fill="#496258" text-anchor="start" font-weight="normal">42.195 km · exact average before checkpoint rounding</text><text x="26" y="550" font-size="13" fill="#496258" text-anchor="start" font-weight="normal">Reference card; use the generator for a fitted wrist band.</text></g></svg>
