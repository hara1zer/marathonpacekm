name: AdSense quality and consent QA
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/site-telemetry.js'
      - 'privacy/**'
      - 'editorial-policy/**'
      - '.github/quality/site-readiness-regressions.mjs'
      - '.github/quality/affiliate-analytics-regressions.mjs'
      - '.github/workflows/site-readiness-qa.yml'
permissions:
  contents: read
jobs:
  site-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consent and analytics behaviour
        run: node .github/quality/affiliate-analytics-regressions.mjs
      - name: Indexed page, article and advertising checks
        run: node .github/quality/site-readiness-regressions.mjs
