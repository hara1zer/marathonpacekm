name: Affiliate analytics QA
on:
  pull_request:
    paths:
      - 'assets/site-telemetry.js'
      - 'index.html'
      - '**/*.html'
      - 'index.html'
      - 'marathon-fueling-calculator/index.html'
      - 'blog/marathon-fueling-by-finish-time-gel-schedule/index.html'
      - '.github/quality/affiliate-analytics-regressions.mjs'
      - '.github/quality/expired-affiliate-regressions.mjs'
      - '.github/workflows/affiliate-analytics-qa.yml'
permissions:
  contents: read
jobs:
  tracking-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check analytics and privacy-safe event attributes
        run: |
          node .github/quality/affiliate-analytics-regressions.mjs
          node .github/quality/expired-affiliate-regressions.mjs
